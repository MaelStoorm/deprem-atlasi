name: iOS ekran görüntüsü

# Uygulamayı iPhone simülatöründe açar ve ekran görüntüsü alır (App Store boyutunda, 6.9 inç).
# Görüntüler deponun "ios-ekran" dalına konur.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["iOS derleme"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ios-ekran
  cancel-in-progress: true

jobs:
  ekran:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"

      - name: Siteyi hazırla ve projeyi üret
        run: |
          ios/hazirla.sh
          brew install xcodegen >/dev/null
          cd ios && xcodegen generate

      - name: Simülatörde aç ve görüntü al
        run: |
          set -euo pipefail
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if 'Pro Max' in x['name']]
          print(sorted(c,key=lambda x:x['name'])[-1]['udid'])")
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time "09:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          mkdir -p "$RUNNER_TEMP/ekran"
          cd ios
          for SCHEME in DepremAtlasi; do
            xcodebuild -project DepremAtlasi.xcodeproj -scheme "$SCHEME" -configuration Debug \
              -destination "id=$DEV" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -3
            APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/"$SCHEME".app)
            BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
            xcrun simctl install "$DEV" "$APP"
            xcrun simctl launch "$DEV" "$BID"
            sleep 20
            xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/ekran/$SCHEME-1.png"
            sleep 6
            xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/ekran/$SCHEME-2.png"
            xcrun simctl terminate "$DEV" "$BID" || true
          done
          ls -la "$RUNNER_TEMP/ekran"

      - name: Görüntüleri ios-ekran dalına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/ekran"
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b ios-ekran
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "iOS ekran görüntüleri ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-ekran
