name: Bağlantı testi (geçici)
on:
  push:
    branches: [baglanti-testi]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: İBB bağlantılarının arşiv kopyaları
        run: |
          for u in \
            "depremzemin.ibb.istanbul/tr/olasi-deprem-kayip-tahminleri-ilce-kitapciklari" \
            "depremzemin.ibb.istanbul/uploads/prefix-kadikoy-666ad5d8d1e4c.pdf" \
            "data.ibb.gov.tr/dataset/deprem-senaryosu-analiz-sonuclari" \
            "data.ibb.gov.tr/dataset/mahalle-bazli-bina-analiz-verisi" \
            "data.ibb.gov.tr/dataset/kentsel-acik-ve-yesil-alanlar" ; do
            j=$(curl -s --max-time 30 "https://archive.org/wayback/available?url=$u")
            echo "ARSIV $u => $j"
          done
          for u in "https://acikveri.ibb.istanbul/" "https://www.ibb.istanbul/" "https://data.ibb.gov.tr/" "https://depremzemin.ibb.istanbul/" "https://data.gov.tr/" "https://tdth.afad.gov.tr/" ; do
            r=$(curl -s -o /dev/null -L --max-time 20 -w "%{http_code}" "$u" 2>&1) || r="HATA($?) $r"
            echo "ERISIM $r <= $u"
          done
