name: iOS derleme

# iOS sürümünü GitHub'ın Mac sunucusunda derler, imzalar ve App Store Connect'e (TestFlight) yükler.
# Apple gizli değerleri (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) girilmemişse yalnızca derlenip denetlenir.
# App Store Connect'te uygulama kaydı yoksa derlenir ama yüklenmez (IPA, çalışmanın "Artifacts" bölümüne konur).

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'index.html'
      - 'gizlilik.html'
      - 'yazi.ttf'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { scheme: DepremAtlasi, bundle: com.maelstorm.deprematlasi }
    env:
      SCHEME: ${{ matrix.scheme }}
      BUNDLE_ID: ${{ matrix.bundle }}
      APP_NAME: ${{ matrix.scheme }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Bu sunucuda Xcode 26 yok"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Siteyi hazırla ve Xcode projesini üret
        run: |
          ios/hazirla.sh
          brew install xcodegen >/dev/null
          cd ios && xcodegen generate

      - name: Apple gizli değerleri var mı?
        id: keys
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 girilmemiş: yalnızca simülatör için derlenip denetlenecek."
          fi

      - name: Denetim derlemesi (imzasız, simülatör)
        if: steps.keys.outputs.ok != '1'
        run: |
          cd ios
          xcodebuild -project DepremAtlasi.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -30

      - name: Apple hazırlığı (paket kimliği, sertifika, imza profili)
        if: steps.keys.outputs.ok == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q cryptography
          "$RUNNER_TEMP/venv/bin/python" ios/ci/asc.py

      - name: Sertifikayı anahtar zincirine koy
        if: steps.keys.outputs.ok == '1'
        run: |
          KC="$RUNNER_TEMP/imza.keychain-db"; PW=$(uuidgen)
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$SIGN_KEY" -k "$KC" -T /usr/bin/codesign -T /usr/bin/security
          security import "$SIGN_CERT" -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$SIGN_KEY"
          security find-identity -v -p codesigning "$KC"

      - name: Arşivle
        if: steps.keys.outputs.ok == '1'
        run: |
          cd ios
          xcodebuild -project DepremAtlasi.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -30

      - name: Paketle ve App Store Connect'e yükle
        if: steps.keys.outputs.ok == '1'
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          DEST=export; [ "$APP_EXISTS" = "1" ] && DEST=upload
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/cikti" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          if [ "$DEST" = "upload" ]; then
            echo "Yüklendi. Birkaç dakika içinde App Store Connect > TestFlight'ta görünür (derleme ${{ github.run_number }})."
          fi

      - name: IPA dosyasını sakla (yükleme yapılmadıysa)
        if: steps.keys.outputs.ok == '1' && env.APP_EXISTS != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-iOS
          path: ${{ runner.temp }}/cikti/*.ipa
