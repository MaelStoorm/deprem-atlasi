name: OSM mahalle sınırlarını indir

# Bir ilçenin mahalle sınırlarını OpenStreetMap'ten (Overpass) indirir ve "veri-osm" dalına koyar.
# Elle çalıştırılır; sınır güncellemesi için ham veri sağlar.

on:
  workflow_dispatch:
    inputs:
      ilce:
        description: İlçe adı (OSM'deki gibi)
        default: Kadıköy

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - name: Overpass'tan indir
        env:
          ILCE: ${{ github.event.inputs.ilce }}
        run: |
          mkdir out && cd out
          Q="[out:json][timeout:180];area[\"name\"=\"$ILCE\"][\"boundary\"=\"administrative\"][\"admin_level\"=\"6\"]->.a;(rel(area.a)[\"boundary\"=\"administrative\"][\"admin_level\"~\"^(8|9|10)$\"];);out geom;"
          echo "$Q" > sorgu.txt
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            echo "== $u" >> hata.txt
            if curl -sS -A "DepremAtlasi/1.0 (+https://github.com/MaelStoorm/deprem-atlasi)" -H "Accept: application/json" --max-time 200 --data-urlencode "data=$Q" "$u" -o osm.json -w "%{http_code}\n" >> hata.txt 2>&1 && python3 -c "import json;json.load(open('osm.json'))" 2>>hata.txt; then break; fi
          done
          python3 -c "import json;d=json.load(open('osm.json'));print(len(d['elements']));[print(e['tags'].get('admin_level'),e['tags'].get('name')) for e in d['elements']]" > liste.txt 2>>hata.txt || true
          head -c 600 osm.json >> hata.txt || true
      - uses: actions/checkout@v5
        with:
          path: depo
      - name: Uygulamanın verisine uygula (önizleme)
        env:
          ILCE: ${{ github.event.inputs.ilce }}
        run: |
          pip install -q shapely matplotlib
          python3 depo/araclar/osm_sinir.py out/osm.json depo/index.html "$(python3 -c "import os;print(os.environ['ILCE'].replace('i','İ').upper())")" out/sonuc 2>&1 | tee out/islem.txt || true
      - name: veri-osm dalına koy
        run: |
          cd out
          git init -q -b veri-osm && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "OSM mahalle sınırları"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri-osm
