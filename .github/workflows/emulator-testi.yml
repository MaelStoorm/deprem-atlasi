# Uygulamanın farklı Android sürümlerinde açılıp açılmadığını emülatörde dener; ekran görüntüsü ve günlük kaydeder.
name: Emülatör testi

permissions:
  contents: write

on:
  push:
    branches: [emulator-testi]
  workflow_dispatch:

jobs:
  dene:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          VERSION_CODE=3 ./gradlew --no-daemon assembleDebug
      - name: Emülatörde aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            mkdir -p cikti
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell dumpsys package com.google.android.webview | grep -m1 versionName > cikti/webview.txt || true
            adb shell dumpsys package com.android.webview | grep -m1 versionName >> cikti/webview.txt || true
            adb logcat -c
            adb shell am start -W -n com.maelstorm.deprematlasi/.MainActivity > cikti/baslat.txt 2>&1 || true
            sleep 25
            adb exec-out screencap -p > cikti/ekran-25sn.png
            sz=$(adb shell wm size | grep -o '[0-9]*x[0-9]*' | tail -1); W=${sz%x*}; H=${sz#*x}
            adb shell input tap $((W/2)) $((H*70/100))
            sleep 10
            adb exec-out screencap -p > cikti/ekran-dokununca.png
            p=$(adb shell pidof com.maelstorm.deprematlasi | tr -d '\r')
            adb forward tcp:9222 localabstract:webview_devtools_remote_$p || true
            node cdp.js > cikti/sayfa.json 2>&1 || true
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" > cikti/odak.txt || true
            adb shell pidof com.maelstorm.deprematlasi > cikti/pid.txt || echo "CALISMIYOR" > cikti/pid.txt
            adb logcat -d > cikti/logcat.txt
      - name: Sonucu dala koy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd cikti
          git init -q -b sonuc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "api ${{ matrix.api }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sonuc:emulator-sonuc-${{ matrix.api }}
