<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2f34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deprem Atlası">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-180.png">
<title>Kadıköy Deprem Atlası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap">
<style>
/* Yerleşim: tam ekran harita (Cep Trafik düzeni). Üstte arama, sağda yüzen yuvarlak düğmeler,
   altta dört sekme; mahalle seçilince alttan kayan panel; diğer ekranlar haritanın üstüne kayar. */
:root{
  --deniz:#aedcf2;  --kara:#f1f0ec;  --kara-yazi:#8a949b;
  --kontrol:#2b2f34; --kontrol-yazi:#ffffff; --kontrol-etkin:#4fb3ff;
  --onay:#3f9f4f; --onay-yazi:#ffffff; --fay:#d93a2f; --fay-bant:rgba(255,120,100,.38);
  --z0:#543005; --z1:#8c510a; --z2:#bf812d; --z3:#dfc27d; --z4:#f6e8c3; --z5:#d5efea; --z6:#a8ddd3; --z7:#80cdc1; --z8:#55b0a2; --z9:#24806f; /* zemin: yumuşak (kahve) → sert (yeşil-mavi) */
  --yuzey:#ffffff;  --yuzey2:#f2f4f3; --murekkep:#17212b; --soluk:#4d5a66; --cizgi:#cfd6da;
  --vurgu:#0b5f7a;  --vurgu-yazi:#ffffff; --vurgu-zemin:#dcebf0;
  --uyari-zemin:#fbf0d9; --uyari-cizgi:#c9902b;
  --h1:#f6e7cf; --h2:#ebc79a; --h3:#d99a5b; --h4:#b8692f; --h5:#7f3f17;      /* hasar: kum → kahve */
  --b1:#e3eef3; --b2:#b7d5e2; --b3:#7fb3cb; --b4:#3f86a9; --b5:#155a7c;      /* barınma: açık → koyu mavi */
  --sade:#ffffff;
  --acil:#c62828; --acil-yazi:#ffffff; --acil-sekme:#ff8a80;
  --g1:#e9a36f; --g2:#f2cf9b; --g3:#ebe6bf; --g4:#a8d29c; --g5:#5d9f69;      /* toplanma: az (turuncu) → çok (yeşil) */
  --t1:#ffffff; --t2:#cfe6f5; --t3:#91c4e6; --t4:#4f93c9; --t5:#1d5a96;      /* tsunami: yok → çok */
  --golge:0 6px 24px rgba(23,33,43,.18);
  --yazi:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --olcek:1; --sekme-h:74px; --alt-bosluk:calc(var(--sekme-h) + 28px + env(safe-area-inset-bottom,0px)); --hiz:280ms; --egri:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --deniz:#0f2a36;--kara:#1d2328;--kara-yazi:#8c99a3;--kontrol:#353c43;--kontrol-yazi:#ffffff;--kontrol-etkin:#6cc4e0;--onay:#4fb062;--onay-yazi:#08200d;
  --yuzey:#1a232b;--yuzey2:#131b21;--murekkep:#eef2f4;--soluk:#a9b6c0;--cizgi:#33424d;
  --vurgu:#6cc4e0;--vurgu-yazi:#08202a;--vurgu-zemin:#173643;--uyari-zemin:#2e2614;--uyari-cizgi:#d9a441;
  --h1:#3d3226;--h2:#634528;--h3:#925e2d;--h4:#c27a3a;--h5:#f0a868;--b1:#1b3440;--b2:#21506a;--b3:#2f7194;--b4:#4f9cc2;--b5:#93d0ea;--sade:#2a3238;--g1:#a8643a;--g2:#8a6d45;--g3:#5b5a45;--g4:#3f6b46;--g5:#4f9a5f;--t1:#2a3238;--t2:#1f3b52;--t3:#24577c;--t4:#2f7cb3;--t5:#7fbde6;
  --golge:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --deniz:#0f2a36;--kara:#1d2328;--kara-yazi:#8c99a3;--kontrol:#353c43;--kontrol-yazi:#ffffff;--kontrol-etkin:#6cc4e0;--onay:#4fb062;--onay-yazi:#08200d;
  --yuzey:#1a232b;--yuzey2:#131b21;--murekkep:#eef2f4;--soluk:#a9b6c0;--cizgi:#33424d;
  --vurgu:#6cc4e0;--vurgu-yazi:#08202a;--vurgu-zemin:#173643;--uyari-zemin:#2e2614;--uyari-cizgi:#d9a441;
  --h1:#3d3226;--h2:#634528;--h3:#925e2d;--h4:#c27a3a;--h5:#f0a868;--b1:#1b3440;--b2:#21506a;--b3:#2f7194;--b4:#4f9cc2;--b5:#93d0ea;--sade:#2a3238;--g1:#a8643a;--g2:#8a6d45;--g3:#5b5a45;--g4:#3f6b46;--g5:#4f9a5f;--t1:#2a3238;--t2:#1f3b52;--t3:#24577c;--t4:#2f7cb3;--t5:#7fbde6;
  --golge:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html{font-size:calc(112.5% * var(--olcek))}
body{background:var(--deniz);color:var(--murekkep);font-family:var(--yazi);font-size:1rem;line-height:1.45;margin:0;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:var(--vurgu);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--vurgu);outline-offset:2px}
#uyg{position:relative;height:100%;overflow:hidden;overflow:clip}

/* --- Harita --- */
#harita{position:absolute;inset:0;touch-action:none;background:var(--deniz)}
#harita svg{display:block;width:100%;height:100%}
.kara{fill:var(--kara);stroke:none}
.zemin-hucre{stroke:none;pointer-events:none}
.fay-bant{fill:none;stroke:var(--fay-bant);stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.fay-kenar{fill:none;stroke:var(--yuzey);stroke-opacity:.9;stroke-width:8;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.fay-ok{fill:none;stroke:var(--fay);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.fay{fill:none;stroke:var(--fay);stroke-width:4;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.fay-etk{font-family:var(--yazi);font-weight:800;fill:var(--fay);letter-spacing:.12em;paint-order:stroke;stroke:var(--deniz);stroke-linejoin:round;pointer-events:none}
.mah{stroke:var(--murekkep);stroke-opacity:.55;stroke-width:1.4;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .35s,opacity .3s}
.mah.sonuk{opacity:.45}
.mah.secili{stroke:var(--murekkep);stroke-opacity:1;stroke-width:4}
.etk{font-family:var(--yazi);font-weight:800;fill:var(--murekkep);letter-spacing:.06em;paint-order:stroke;stroke:var(--yuzey);stroke-linejoin:round;pointer-events:none;transition:opacity .3s}
.cevre-etk{font-family:var(--yazi);font-weight:600;fill:var(--kara-yazi);letter-spacing:.22em;pointer-events:none}
.konum-nokta{fill:var(--vurgu);stroke:var(--yuzey);stroke-width:3;vector-effect:non-scaling-stroke}
.konum-hale{fill:var(--vurgu);opacity:.2}

/* --- Üst arama çubuğu --- */
.ust{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:8px;z-index:4;pointer-events:none}
.arama-dugme{pointer-events:auto;display:flex;align-items:center;gap:12px;min-height:60px;padding:0 16px;border-radius:30px;border:0;background:var(--yuzey);box-shadow:var(--golge);cursor:pointer;text-align:left;font-size:1.1rem;color:var(--soluk)}
.arama-dugme svg{width:26px;height:26px;flex:none;color:var(--murekkep)}
.arama-dugme .logo{width:34px;height:34px}
.lejant-serit{pointer-events:auto;align-self:flex-start;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--yuzey);box-shadow:var(--golge);font-size:.85rem;font-weight:600;max-width:100%}
.lejant-serit .renkler{display:flex}
.lejant-serit .renkler i{width:22px;height:14px}
.lejant-serit .renkler i:first-child{border-radius:4px 0 0 4px}.lejant-serit .renkler i:last-child{border-radius:0 4px 4px 0}

/* --- Yüzen düğmeler (koyu, köşeleri yuvarlak kare) --- */
.yuzen{position:absolute;right:12px;z-index:3;display:flex;flex-direction:column;gap:10px}
.yuzen.ust-sag{top:calc(env(safe-area-inset-top,0px) + 142px)}
.yuzen.alt-sag{bottom:calc(var(--alt-bosluk) + 4px)}
.yuvarlak{width:64px;height:64px;border-radius:16px;border:0;background:var(--kontrol);color:var(--kontrol-yazi);box-shadow:var(--golge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:.7rem;font-weight:800;transition:transform .15s}
.yuvarlak svg{width:26px;height:26px}
.yuvarlak:active{transform:scale(.93)}
.zoom-grup{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;box-shadow:var(--golge);background:var(--kontrol)}
.zoom-grup button{width:64px;height:60px;border:0;background:none;color:var(--kontrol-yazi);font-size:1.9rem;font-weight:600;line-height:1;cursor:pointer}
.zoom-grup button+button{border-top:1px solid rgba(255,255,255,.18)}

/* --- Alt menü: ortada duran koyu çubuk --- */
.sekmeler{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),30rem);z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--kontrol);border-radius:18px;box-shadow:var(--golge);overflow:hidden}
.sekme{min-height:var(--sekme-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.8rem;font-weight:600;color:var(--kontrol-yazi);cursor:pointer;position:relative}
.sekme+.sekme{border-left:1px solid rgba(255,255,255,.12)}
.sekme svg{width:28px;height:28px}
.sekme[aria-current="page"]{color:var(--kontrol-etkin);font-weight:800}
.sekme[aria-current="page"]::before{content:"";position:absolute;bottom:6px;left:30%;right:30%;height:4px;border-radius:2px;background:var(--kontrol-etkin)}

/* --- Alt panel (mahalle özeti) --- */
.panel{position:absolute;left:8px;right:8px;bottom:var(--alt-bosluk);z-index:10;background:var(--yuzey);border-radius:22px;box-shadow:var(--golge);padding:8px 16px 16px;transform:translateY(calc(100% + var(--alt-bosluk)));transition:transform var(--hiz) var(--egri);max-height:62%;overflow:auto}
.panel.acik{transform:none}
.tutamak{width:44px;height:5px;border-radius:3px;background:var(--cizgi);margin:0 auto 10px}
.panel-bas{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.panel-bas h2{flex:1;font-size:1.5rem}
.panel-bas p{color:var(--soluk);font-size:.9rem}
.kapat{width:52px;height:52px;border-radius:26px;border:2px solid var(--cizgi);background:var(--yuzey2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.kapat svg{width:22px;height:22px}
.karolar{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:10px;margin-bottom:12px}
.karo{background:var(--yuzey2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.karo b{font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.karo span{font-size:.85rem;color:var(--soluk)}
.dugmeler{display:flex;gap:10px;flex-wrap:wrap}
.dugme{flex:1 1 9rem;min-height:60px;border-radius:14px;border:2px solid var(--cizgi);background:var(--yuzey);font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;color:var(--murekkep);padding:8px 14px;text-align:center}
.dugme svg{width:24px;height:24px;flex:none}
.dugme.ana{background:var(--vurgu);border-color:var(--vurgu);color:var(--vurgu-yazi)}
.dugme:active{transform:translateY(1px)}

/* --- Tam ekran sayfalar (haritanın üstüne kayar) --- */
.sayfa{position:absolute;inset:0;bottom:calc(var(--sekme-h) + 12px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--yuzey2);overflow:auto;transform:translateY(100%);transition:transform var(--hiz) var(--egri),visibility 0s var(--hiz);visibility:hidden;padding-bottom:16px}
.sayfa.acik{transform:none;visibility:visible;transition:transform var(--hiz) var(--egri)}
.sayfa.yan{transform:translateX(100%)}
.sayfa.yan.acik{transform:none}
.sayfa-ust{position:sticky;top:0;z-index:2;background:var(--yuzey);display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--cizgi)}
.sayfa-ust h2{flex:1;font-size:1.3rem;min-width:0}
.geri{min-height:52px;padding:0 16px 0 10px;border-radius:12px;border:2px solid var(--murekkep);background:var(--yuzey);font-weight:800;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.geri svg{width:22px;height:22px}
.icerik{max-width:36rem;margin:0 auto;padding:0 16px;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
.kart{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.kart h3{font-size:1.15rem}
.etiket{font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--soluk)}
.kaynak{font-size:.85rem;color:var(--soluk);border-top:1px solid var(--cizgi);padding-top:10px}
.kaynak button{all:unset;color:var(--vurgu);text-decoration:underline;cursor:pointer;font-weight:600}
.not{background:var(--uyari-zemin);border-left:5px solid var(--uyari-cizgi);border-radius:8px;padding:12px 14px;font-size:.95rem}
.sayilar{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-variant-numeric:tabular-nums;align-items:baseline;margin:0}
.sayilar dt{color:var(--soluk)}
.sayilar dd{margin:0;font-weight:800;font-size:1.15rem;text-align:right}
.buyuk-sayi{font-size:2.5rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.serit{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--cizgi)}
.serit i{display:block;height:100%}
.liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.liste button{width:100%;min-height:60px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-radius:12px;border:1px solid var(--cizgi);background:var(--yuzey);font-weight:600;font-size:1.1rem;text-align:left;cursor:pointer}
.liste button i{width:16px;height:16px;border-radius:4px;flex:none;border:1px solid var(--cizgi)}
.liste button span{flex:1}
.arama{width:100%;min-height:60px;font:inherit;font-size:1.1rem;padding:12px 16px;border-radius:14px;border:2px solid var(--murekkep);background:var(--yuzey);color:var(--murekkep)}
.yer-listesi{list-style:none;margin:0;padding:0}
.yer-listesi li{padding:10px 0;border-bottom:1px solid var(--cizgi)}
.yer-listesi li:last-child{border-bottom:0}
.cipler{display:flex;flex-wrap:wrap;gap:8px}
.cipler button{min-height:48px;padding:6px 14px;border-radius:24px;border:2px solid var(--cizgi);background:var(--yuzey);font-weight:600;cursor:pointer}
.cipler button[aria-pressed="true"]{background:var(--murekkep);color:var(--yuzey);border-color:var(--murekkep)}
.secenek{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.secenek button{min-height:64px;border-radius:12px;border:2px solid var(--cizgi);background:var(--yuzey);font-weight:800;cursor:pointer;padding:6px}
.secenek button[aria-pressed="true"]{border-color:var(--vurgu);background:var(--vurgu-zemin);box-shadow:inset 0 0 0 2px var(--vurgu)}
.katman-sec{display:flex;flex-direction:column;gap:10px}
.katman-sec button{display:flex;align-items:center;gap:14px;min-height:72px;padding:10px 14px;border-radius:14px;border:2px solid var(--cizgi);background:var(--yuzey);text-align:left;cursor:pointer}
.katman-sec button[aria-pressed="true"]{border-color:var(--vurgu);box-shadow:inset 0 0 0 2px var(--vurgu)}
.katman-sec .ornek{display:flex;flex:none}
.katman-sec .ornek i{width:12px;height:36px}
.katman-sec b{display:block}
.katman-sec small{color:var(--soluk);font-size:.85rem}
.mini-lejant{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.mini-lejant div{display:flex;align-items:center;gap:10px}
.mini-lejant i{width:28px;height:18px;border-radius:4px;border:1px solid var(--cizgi);flex:none}

/* --- Sorgu formu (TKGM düzeni) --- */
.sorgu{display:flex;flex-direction:column;gap:12px}
.sorgu label{font-weight:600}
.sorgu select{width:100%;min-height:60px;font:inherit;font-size:1.1rem;padding:0 14px;border-radius:10px;border:2px solid var(--cizgi);background:var(--yuzey);color:var(--murekkep)}
.sorgu select:focus{border-color:var(--vurgu)}
.sorgula{min-height:64px;border:0;border-radius:10px;background:var(--onay);color:var(--onay-yazi);font-weight:800;font-size:1.2rem;cursor:pointer}
.sorgula:active{transform:translateY(1px)}
.ayrac{display:flex;align-items:center;gap:12px;color:var(--soluk);font-size:.9rem}
.ayrac::before,.ayrac::after{content:"";flex:1;height:1px;background:var(--cizgi)}
.grup-serit{display:flex;height:26px;border-radius:6px;overflow:hidden}
.grup-serit i{display:block;height:100%}

/* --- Bildirim ve açılış --- */
.bildirim{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 84px);z-index:30;background:var(--murekkep);color:var(--yuzey);border-radius:14px;padding:14px 16px;box-shadow:var(--golge);transform:translateY(-140%);opacity:0;visibility:hidden;pointer-events:none;transition:transform var(--hiz) var(--egri),opacity var(--hiz),visibility 0s var(--hiz)}
.bildirim.gor{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform var(--hiz) var(--egri),opacity var(--hiz)}
.acilis{position:absolute;inset:0;z-index:40;background:var(--yuzey2);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .5s}
.acilis.git{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
.acilis .kutu{max-width:30rem;display:flex;flex-direction:column;gap:16px}
.marka{display:flex;align-items:center;gap:14px}
.marka svg{width:56px;height:56px;flex:none}
.marka h1{font-size:1.7rem;font-weight:800}
/* --- Acil durum --- */
.sekme.acil-sekme svg{color:var(--acil-sekme)}
.dugme.acil{background:var(--acil);border-color:var(--acil);color:var(--acil-yazi);min-height:84px;font-size:1.5rem}
.dugme.acil svg{width:34px;height:34px}
.adimlar{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;counter-reset:a}
.adimlar li{background:var(--yuzey2);border-radius:12px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:4px}
.adimlar b{font-size:1.3rem}
.adimlar span{font-size:.85rem;color:var(--soluk)}
.madde{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.kontrol-liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.kontrol-liste label{display:flex;align-items:center;gap:14px;min-height:56px;padding:6px 12px;border-radius:12px;border:1px solid var(--cizgi);cursor:pointer;font-size:1.05rem}
.kontrol-liste input{width:28px;height:28px;flex:none;accent-color:var(--onay)}
.kontrol-liste input:checked+span{color:var(--soluk);text-decoration:line-through}
.tablo{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tablo th,.tablo td{padding:10px 6px;border-bottom:1px solid var(--cizgi);text-align:right}
.tablo th:first-child,.tablo td:first-child{text-align:left}
.tablo th{font-size:.8rem;color:var(--soluk);font-weight:800}
.tablo tr.secili-satir td{background:var(--vurgu-zemin);font-weight:800}
.panel-bilgi{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:.98rem}
.panel-bilgi p{display:flex;gap:8px;align-items:flex-start}
.panel-bilgi i{width:12px;height:12px;border-radius:3px;flex:none;margin-top:.35em}

  for(let i=0;i<p.length-1;i++){const f=p[i][0]*p[i+1][1]-p[i+1][0]*p[i][1];A+=f;cx+=(p[i][0]+p[i+1][0])*f;cy+=(p[i][1]+p[i+1][1])*f;}

const KATMANLAR = {

let gorunum = { cx: ILCE.w/2, cy: ILCE.h/2, s: 1 };   // s: harita birimi / ekran pikseli

  const kara = V.cevre.kara.map(h => `<path class="kara" d="${yolStr(h)}"/>`).join("");

    <g id="g-sec"></g><g id="g-etk">${etk}</g><g id="g-konum"></g></svg>`;

function zeminGoster(){ const g=$("#g-zemin"); if (!g) return;
  g.style.display = KATMANLAR[ayar.katman].hucre ? "" : "none";
  $("#g-zemin-yumusak").style.display = ayar.zeminGorunum==="yumusak" ? "" : "none";
  $("#g-zemin-kare").style.display = ayar.zeminGorunum==="kare" ? "" : "none";
  $("#g-fay").style.display = ayar.fayGoster ? "" : "none"; }
const svg = () => $("#hsvg");
function alanBoyu(){ const r=kap.getBoundingClientRect(); return [r.width||400, r.height||800]; }
function viewBoxYaz(){
  const [W,H]=alanBoyu(), g=gorunum;
  svg().setAttribute("viewBox", `${(g.cx-W*g.s/2).toFixed(2)} ${(g.cy-H*g.s/2).toFixed(2)} ${(W*g.s).toFixed(2)} ${(H*g.s).toFixed(2)}`);
  const o = ayar.olcek;
  svg().querySelectorAll("text[data-boy]").forEach(t => { t.setAttribute("font-size", (t.dataset.boy*o*g.s).toFixed(2)); t.setAttribute("stroke-width", (3.5*g.s).toFixed(2)); });
  // Çok uzaklaşınca mahalle adları üst üste biniyor: gizle (dokununca panel yine açılır)
  const etk=$("#g-etk"); if (etk) { const uzak = g.s > Math.max(ILCE.w/(W-32), ILCE.h/Math.max(200,H-260))*1.9;
    etk.style.opacity = uzak ? 0 : 1; svg().querySelectorAll(".yakin-etk").forEach(t => t.style.opacity = uzak ? 0 : 1); }
  svg().querySelectorAll(".konum-nokta").forEach(c => c.setAttribute("r", (9*g.s).toFixed(2)));
  svg().querySelectorAll(".konum-hale").forEach(c => c.setAttribute("r", (24*g.s).toFixed(2)));
}
// Görünür alan: üst çubuk ve alt panel/sekme payı çıkarılır
function payli(){ const [W,H]=alanBoyu(); const ust=150, nav=$(".sekmeler").offsetHeight+24, alt=(document.querySelector(".panel.acik")? Math.min(H*0.55, $("#panel").offsetHeight) : 0) + nav; return {W,H,ust,alt}; }
function hedefKutu([x0,y0,x1,y1]){
  const {W,H,ust,alt}=payli(); const gw=W-32, gh=Math.max(120,H-ust-alt);
  const s=Math.max((x1-x0)/gw,(y1-y0)/gh);
  const cx=(x0+x1)/2, cy=(y0+y1)/2 + ((alt-ust)/2)*s;  // panel aşağıdaysa merkezi yukarı al
  return {cx, cy, s};
}
function uc(hedef, anim=true){
  if (!anim || hareketAz()){ gorunum = hedef; viewBoxYaz(); return; }
  const bas={...gorunum}, t0=performance.now(), sure=520;
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  (function adim(t){ const k=Math.min(1,(t-t0)/sure), e=ease(k);
    gorunum={cx:bas.cx+(hedef.cx-bas.cx)*e, cy:bas.cy+(hedef.cy-bas.cy)*e, s:Math.exp(Math.log(bas.s)+(Math.log(hedef.s)-Math.log(bas.s))*e)};
    viewBoxYaz(); if(k<1) requestAnimationFrame(adim); })(t0);
}
function sigdir(anim=true){ const p=ILCE.w*0.03; uc(hedefKutu([-p,-p,ILCE.w+p,ILCE.h+p]), anim); }
function yakinlas(f, ekranXY){
  const [W,H]=alanBoyu(); const sMin=hedefKutu([0,0,ILCE.w,ILCE.h]).s*4.5, sMax=sMin/14;
  const yeniS=Math.min(sMin, Math.max(sMax, gorunum.s/f));
  if (ekranXY){ const [px,py]=ekranXY; const mx=gorunum.cx+(px-W/2)*gorunum.s, my=gorunum.cy+(py-H/2)*gorunum.s;
    gorunum.cx = mx-(px-W/2)*yeniS; gorunum.cy = my-(py-H/2)*yeniS; }
  gorunum.s=yeniS; viewBoxYaz();
}
function katmanBoya(){

function secimiCiz(){

/* --- Dokunma: kaydırma, iki parmakla yakınlaştırma, tıklama --- */
const parmak = new Map(); let surukleBas=null, hareket=0, kiskac=null;
kap.addEventListener("pointerdown", e => { kap.setPointerCapture(e.pointerId); parmak.set(e.pointerId,[e.clientX,e.clientY]); hareket=0;
  if (parmak.size===1) surukleBas={x:e.clientX,y:e.clientY,cx:gorunum.cx,cy:gorunum.cy};
  if (parmak.size===2){ const [a,b]=[...parmak.values()]; kiskac={d:Math.hypot(a[0]-b[0],a[1]-b[1]), s:gorunum.s}; } });
kap.addEventListener("pointermove", e => { if(!parmak.has(e.pointerId)) return; parmak.set(e.pointerId,[e.clientX,e.clientY]);
  const r=kap.getBoundingClientRect();
  if (parmak.size===2 && kiskac){ const [a,b]=[...parmak.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); hareket+=99;
    yakinlas(gorunum.s/(kiskac.s*kiskac.d/d), [(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top]); return; }
  if (surukleBas){ const dx=e.clientX-surukleBas.x, dy=e.clientY-surukleBas.y; hareket=Math.max(hareket,Math.hypot(dx,dy));
    if (hareket>6){ gorunum.cx=surukleBas.cx-dx*gorunum.s; gorunum.cy=surukleBas.cy-dy*gorunum.s; viewBoxYaz(); } } });
function birak(e){ const tik = parmak.size===1 && hareket<=6; parmak.delete(e.pointerId);
  if (parmak.size<2) kiskac=null;
  if (parmak.size===1){ const [p]=[...parmak.values()]; surukleBas={x:p[0],y:p[1],cx:gorunum.cx,cy:gorunum.cy}; }
  if (parmak.size===0) surukleBas=null;
  if (tik && e.type==="pointerup"){ const hedef=document.elementFromPoint(e.clientX,e.clientY); const p=hedef && hedef.closest && hedef.closest(".mah[data-m]");
    if (p) mahalleSec(p.dataset.m); else if (secili) paneliKapat(); } }
kap.addEventListener("pointerup", birak); kap.addEventListener("pointercancel", birak);
kap.addEventListener("wheel", e => { e.preventDefault(); const r=kap.getBoundingClientRect(); yakinlas(e.deltaY<0?1.25:0.8,[e.clientX-r.left,e.clientY-r.top]); }, {passive:false});
window.addEventListener("resize", () => viewBoxYaz());

/* ================= Konum ================= */
function konumBul(){
  if (!navigator.geolocation){ bildir("Bu cihaz konum bilgisi vermiyor. Mahalleler sekmesinden seçebilirsiniz."); return; }
  bildir("Konumunuz alınıyor…", 15000);
  navigator.geolocation.getCurrentPosition(p => {
    const n=[p.coords.longitude,p.coords.latitude];
    let m=V.mahalleler.find(x=>icinde(n,x.sinir));
    if(!m){ const y=V.mahalleler.map(x=>[enYakinMesafe(n,x.sinir),x]).sort((a,b)=>a[0]-b[0])[0]; if(y[0]<=200) m=y[1]; }
    const [x,y]=proj(n); $("#g-konum").innerHTML=`<circle class="konum-hale" cx="${x}" cy="${y}"/><circle class="konum-nokta" cx="${x}" cy="${y}"/>`; viewBoxYaz();
    if (m){ mahalleSec(m.anahtar); bildir(`Bulunduğunuz yer ${m.ad} mahallesinde. Senaryo fayına uzaklığı yaklaşık ${Math.round(fayUzaklik(n))} km.`, 6000); }
    else bildir("Konumunuz Kadıköy dışında görünüyor. Şimdilik yalnızca Kadıköy var.");
  }, () => bildir("Konum izni verilmedi veya alınamadı. Mahalleler sekmesinden mahallenizi seçebilirsiniz."), {timeout:15000, maximumAge:60000});
}
